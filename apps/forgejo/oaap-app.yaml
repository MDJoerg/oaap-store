oaap_manifest: "0.16"

app:
  id: forgejo
  name: Forgejo
  version: 15.0.11
  type: wrapped
  description: "Git-Hosting auf der eigenen Plattform: Repositories, Issues, Pull Requests (Community-Fork von Gitea). Meldet Personen über den Anmeldedienst des Mandanten an, wenn der Betreiber ihr einen Client gibt (RFC-0091)."

care:
  # RFC-0071 §15: Die Basis ist auf eine Version festgenagelt, beim Bau
  # wird nichts nachgeladen — ein Neubau holt nur denselben Stand neu.
  rebuild: self

services:
  web:
    # Forgejo 15 = die LTS-Linie (Stand 18.11.2026; 17 ist die neueste).
    # Gebaut über dem offiziellen Image, nur mit einem Einstiegsschritt
    # davor (Dockerfile). Das Image kommt von data.forgejo.org, dem
    # Spiegel des Projekts: codeberg.org war am Tag der Messung nicht
    # erreichbar.
    build: .
    port: 3000

routes:
  # Begründete public-Ausnahme (RFC-0002, RFC-0091 §4.1): git clone/push
  # über HTTPS kann den Portal-Login nicht durchlaufen — Forgejo
  # authentifiziert jede Anfrage selbst. Das Gateway strippt die
  # Identitäts-Header auch hier (Contract-Garantie 1).
  - path: /
    roles: [public]

# Manifest 0.16 (Runtime 2.35, RFC-0091 Stufe 3): Forgejo meldet Personen
# selbst über den Realm des Mandanten an. Den Client legt der Betreiber an
# (`oaap idp app <connector> --instance <name>`), die Installation nicht.
# Ohne ihn bleibt alles wie bisher: eigene Konten, Registrierung zu.
identity:
  oidc_client:
    # „oaap" ist der Name der Anmeldequelle, die entrypoint.sh anlegt.
    redirect_paths: [/user/oauth2/oaap/callback]
    groups_claim: true

storage:
  # Repositories, SQLite-Datenbank und Forgejo-Konfiguration (app.ini)
  - name: data
    mount: /data

config:
  # Öffentliche Adresse für angezeigte Clone-URLs, mit / am Ende. Leer =
  # der erste Name der Instanz mit https:// (OAAP_INSTANCE_NAMES) — das
  # ist auch die Adresse, an die der Anmeldedienst zurückleitet.
  - key: FORGEJO__server__ROOT_URL
    label: "Öffentliche Adresse (Clone-URLs, leer = erster Name der Instanz)"
    default: ""
  # Setup-Assistent überspringen: SQLite und sinnvolle Defaults sind
  # damit gesetzt; den ersten Admin legt ein CLI-Einzeiler an (README).
  - key: FORGEJO__security__INSTALL_LOCK
    label: "Setup-Assistent überspringen (true/false)"
    default: "true"
  # Das OAAP-Gateway routet nur HTTP — Git läuft über HTTPS,
  # SSH-Zugang bleibt aus (Spec-Lücke Nicht-HTTP-Ports).
  - key: FORGEJO__server__DISABLE_SSH
    label: "SSH-Zugang deaktivieren (true/false)"
    default: "true"
  # Sicher per Default auf der public-Route: keine Selbstregistrierung.
  # Mit einem Client des Mandanten öffnet entrypoint.sh die Registrierung
  # NUR über den Anmeldedienst (siehe OAAP_FORGEJO_REALM_SIGNUP).
  - key: FORGEJO__service__DISABLE_REGISTRATION
    label: "Selbstregistrierung sperren (true/false)"
    default: "true"
  # Auch Lesen nur mit Anmeldung (anonym sieht nichts).
  - key: FORGEJO__service__REQUIRE_SIGNIN_VIEW
    label: "Anmeldung auch zum Lesen (true/false)"
    default: "true"
  # Wer sich zum ersten Mal über den Anmeldedienst anmeldet, bekommt ein
  # Forgejo-Konto. Wer in den Realm darf, entscheidet der Realm.
  - key: OAAP_FORGEJO_REALM_SIGNUP
    label: "Neue Konten über den Anmeldedienst anlegen (true/false)"
    default: "true"
  # Forgejo-interne Rechte aus Realm-Gruppen, volle Pfade wie im Token
  # (`/forgejo-admins`). Das sind Rechte IN Forgejo, keine
  # Plattformrollen (RFC-0091 §4.3). Leer = Forgejo vergibt nichts aus
  # Gruppen. Vorsicht beim Admin: Wer im Realm Gruppen verwaltet, macht
  # damit Forgejo-Administratoren.
  - key: OAAP_FORGEJO_ADMIN_GROUP
    label: "Realm-Gruppe für Forgejo-Administratoren (z. B. /forgejo-admins, leer = keine)"
    default: ""
  - key: OAAP_FORGEJO_RESTRICTED_GROUP
    label: "Realm-Gruppe für eingeschränkte Benutzer (z. B. /partner, leer = keine)"
    default: ""

health:
  path: /api/healthz
  startup_grace_seconds: 180
