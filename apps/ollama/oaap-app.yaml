oaap_manifest: "0.2"

app:
  id: ollama
  name: Ollama
  version: 0.9.1
  type: wrapped
  # Ollama wird von anderer Software bedient (z. B. Open WebUI), nicht
  # von einem Menschen — die Kachel im Launchpad führte auf eine reine
  # Schnittstelle. Runtime-Spec 2.10; erstes Manifest im Format 0.2.
  class: service
  description: "Lokale KI-Modelle als API (llama, mistral, qwen, …); braucht je nach Modell mehrere GB RAM"

services:
  web:
    image: ollama/ollama:latest
    port: 11434

routes:
  - path: /
    roles: [keyuser, admin]

storage:
  # heruntergeladene Modelle — kann groß werden
  - name: models
    mount: /root/.ollama

health:
  path: /
  startup_grace_seconds: 120
