oaap_manifest: "0.1"

app:
  id: stirling-pdf
  name: Stirling PDF
  version: 0.36.1
  type: wrapped
  description: "PDF-Werkzeuge im Browser: zusammenfügen, teilen, umwandeln, komprimieren"

services:
  web:
    image: stirlingtools/stirling-pdf:latest
    port: 8080

config:
  # Kein Doppel-Login: das OAAP-Gateway authentifiziert bereits jede
  # Anfrage — Stirlings eigener Login bleibt deshalb aus.
  - key: SECURITY_ENABLELOGIN
    label: "Eigener Stirling-Login (true/false)"
    default: "false"

routes:
  - path: /
    roles: [user, keyuser, admin]

storage:
  - name: configs
    mount: /configs

health:
  path: /
  startup_grace_seconds: 180
